name: Atualizar pauta

# As rotinas criam os rascunhos às 07h e 12h (BRT). Este workflow poderia rodar
# só duas vezes, logo depois — mas o cron do GitHub Actions não é confiável:
# atrasa e às vezes simplesmente não dispara. Por isso ele roda de hora em hora
# durante o dia. Cada execução é idempotente: se não há pauta nova, ela encerra
# em segundos sem commitar nada. Assim, um horário perdido é recuperado no
# seguinte, em vez de ficar o dia inteiro desatualizado.
on:
  schedule:
    - cron: "25 10-21 * * *"   # de hora em hora, 07:25 às 18:25 BRT
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-pauta
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler os rascunhos do Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/sync_gmail.py

      - name: Regerar a versão de arquivo único
        run: |
          python scripts/build_share.py
          cp dist/dashboard-completo.html dashboard-completo.html

      - name: Publicar as pautas novas
        id: publicar
        run: |
          if [ -z "$(git status --porcelain data/ dashboard-completo.html)" ]; then
            echo "Nada novo — nenhum commit necessário."
            echo "mudou=nao" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard-completo.html
          git commit -m "Pauta atualizada automaticamente"
          # rebase antes do push: se outra execução commitou nesse meio-tempo,
          # integra em vez de falhar
          git pull --rebase origin main
          git push
          echo "mudou=sim" >> $GITHUB_OUTPUT

      # O Pages publica sozinho a cada commit, mas os builds falham de forma
      # intermitente (o mesmo commit já compilou numa tentativa e errou na
      # seguinte). Aqui pedimos o build e conferimos, tentando de novo se errar.
      - name: Garantir que o site publicou
        if: steps.publicar.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de build do Pages..."
            gh api --method POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
            for _ in $(seq 1 40); do
              estado=$(gh api "repos/${{ github.repository }}/pages/builds?per_page=1" --jq '.[0].status')
              [ "$estado" != "building" ] && [ "$estado" != "queued" ] && break
              sleep 15
            done
            if [ "$estado" = "built" ]; then
              echo "Site publicado."
              exit 0
            fi
            echo "Build terminou como '$estado'. Tentando de novo."
            sleep 20
          done
          echo "::error::O GitHub Pages não conseguiu publicar após 3 tentativas."
          echo "Os dados estão commitados e seguros — só a publicação falhou."
          exit 1
