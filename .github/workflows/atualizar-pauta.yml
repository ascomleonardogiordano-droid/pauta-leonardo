name: Atualizar pauta

# Roda depois das duas rotinas que criam os rascunhos no Gmail:
# 07h BRT (10:00 UTC) e 12h BRT (15:00 UTC). A margem de 25 min é folga
# para a rotina terminar de escrever o rascunho.
on:
  schedule:
    - cron: "25 10 * * *"
    - cron: "25 15 * * *"
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

# O site é servido pelo GitHub Pages direto do branch main (Settings → Pages →
# Source: Deploy from a branch). Este workflow só precisa commitar os dados —
# o Pages publica sozinho a cada commit. Não use actions/deploy-pages aqui: ele
# exige o modo "GitHub Actions" e conflita com o modo por branch.
permissions:
  contents: write

concurrency:
  group: atualizar-pauta
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler os rascunhos do Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/sync_gmail.py

      - name: Regerar a versão de arquivo único
        run: |
          python scripts/build_share.py
          cp dist/dashboard-completo.html dashboard-completo.html

      - name: Publicar as pautas novas
        run: |
          if [ -z "$(git status --porcelain data/ dashboard-completo.html)" ]; then
            echo "Nada novo — nenhum commit necessário."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard-completo.html
          git commit -m "Pauta atualizada automaticamente"
          # rebase antes do push: se outra execução commitou nesse meio-tempo,
          # integra em vez de falhar
          git pull --rebase origin main
          git push
          echo "Commitado — o GitHub Pages publica em ~1 minuto."
